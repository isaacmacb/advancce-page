<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios | ADVANNCE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .report-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }

        .report-card:hover {
            border-color: rgba(255,59,59,0.3);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .report-card .icon {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 15px;
        }

        .report-card h3 {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .report-card p {
            color: #9aa4b8;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .report-card .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 12px;
        }

        .status-badge.available {
            background: rgba(46,213,115,0.15);
            color: #2ed573;
        }

        .status-badge.pending {
            background: rgba(255,193,7,0.15);
            color: #ffc107;
        }

        .status-badge.unavailable {
            background: rgba(255,59,59,0.15);
            color: #ff6b6b;
        }

        .btn-download-report {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background: transparent;
            border: 1px solid #ff3b3b;
            color: #ff3b3b;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
            width: 100%;
            text-align: center;
        }

        .btn-download-report:hover {
            background: #ff3b3b;
            color: #fff;
        }

        .btn-download-report.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #6a7a8a;
            color: #6a7a8a;
        }

        .btn-download-report.disabled:hover {
            background: transparent;
            color: #6a7a8a;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
        }

        .empty-state .icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #9aa4b8;
            max-width: 500px;
            margin: 0 auto 10px;
        }

        .empty-state .sub {
            color: #6a7a8a;
            font-size: 0.9rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .section-title span {
            color: #ff3b3b;
        }

        .section-subtitle {
            color: #9aa4b8;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .report-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .report-metrics .metric {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 12px;
        }

        .report-metrics .metric .value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ff3b3b;
        }

        .report-metrics .metric .label {
            color: #6a7a8a;
            font-size: 0.75rem;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .alert-info {
            background: rgba(88,166,255,0.1);
            border: 1px solid rgba(88,166,255,0.2);
            color: #58a6ff;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .reports-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-page">
        <div class="container">

            <!-- HEADER -->
            <header class="dashboard-header">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">👤</div>
                    <div>
                        <div class="user-name" id="userName">Usuário</div>
                        <div class="user-email" id="userEmail">email@email.com</div>
                    </div>
                </div>
                <div class="header-actions">
                    <a href="../index.html" class="btn-back-site"><i class="fas fa-home"></i> Site</a>
                    <button class="btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sair</button>
                </div>
            </header>

            <!-- NAVEGAÇÃO -->
            <nav class="dashboard-nav">
                <a href="index.html"><i class="fas fa-home"></i> Visão Geral</a>
                <a href="perfil.html"><i class="fas fa-user"></i> Meus Dados</a>
                <a href="servicos.html"><i class="fas fa-box"></i> Meus Serviços</a>
                <a href="tickets.html"><i class="fas fa-ticket"></i> Tickets</a>
                <a href="notificacoes.html"><i class="fas fa-bell"></i> Notificações</a>
                <a href="relatorios.html" class="active"><i class="fas fa-chart-bar"></i> Relatórios</a>
                <a href="bot.html"><i class="fas fa-robot"></i> Dashboard Bot</a>
            </nav>

            <!-- TÍTULO -->
            <h2 class="section-title">📊 <span>Relatórios</span></h2>
            <p class="section-subtitle">Acompanhe o desempenho dos seus serviços contratados.</p>

            <!-- ALERTA -->
            <div id="alertInfo" class="alert alert-info hidden">
                <i class="fas fa-info-circle"></i>
                <span id="alertMessage">Gerando relatório...</span>
            </div>

            <!-- LISTA DE RELATÓRIOS -->
            <div id="reportsContainer">
                <!-- Será preenchido pelo JavaScript -->
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = "https://bdavgvwaxlokeoaichsw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_C1gh4XFD2148HjtSMzEEFg_2-A8S5IY";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const reportsContainer = document.getElementById('reportsContainer');
        const alertInfo = document.getElementById('alertInfo');
        const alertMessage = document.getElementById('alertMessage');

        // ============================================
        // MAPEAMENTO DE SERVIÇOS
        // ============================================
        const SERVICE_INFO = {
            'hub': {
                name: 'Advancce Hub',
                icon: '🤖',
                description: 'Bot de moderação e tickets',
                metrics: ['comandos', 'membros', 'tickets']
            },
            'boost': {
                name: 'Advancce Boost',
                icon: '⚡',
                description: 'Otimização de performance',
                metrics: ['fps', 'latencia', 'temperatura']
            },
            'shield': {
                name: 'Advancce Shield',
                icon: '🛡️',
                description: 'Proteção e segurança',
                metrics: ['ameacas', 'monitoramento', 'alertas']
            },
            'dev': {
                name: 'Advancce Dev',
                icon: '💻',
                description: 'Desenvolvimento sob medida',
                metrics: ['commits', 'entregas', 'tasks']
            },
            'optimizer': {
                name: 'Advancce Optimizer',
                icon: '⚡',
                description: 'Otimização do sistema',
                metrics: ['cpu', 'memoria', 'disco']
            }
        };

        // ============================================
        // ATUALIZAR HEADER
        // ============================================
        function updateHeader(user) {
            const name = user.user_metadata?.full_name || 'Usuário';
            const email = user.email || 'email@email.com';
            const initial = name.charAt(0).toUpperCase();

            document.getElementById('userName').textContent = name;
            document.getElementById('userEmail').textContent = email;
            document.getElementById('userAvatar').textContent = initial;
        }

        // ============================================
        // GERAR DADOS SIMULADOS DO RELATÓRIO
        // ============================================
        function generateReportData(service) {
            const data = {
                'hub': {
                    comandos: Math.floor(Math.random() * 5000) + 1000,
                    membros: Math.floor(Math.random() * 1000) + 50,
                    tickets: Math.floor(Math.random() * 50) + 5,
                    uptime: (Math.random() * 0.5 + 99.5).toFixed(1)
                },
                'boost': {
                    fps: Math.floor(Math.random() * 120) + 60,
                    latencia: Math.floor(Math.random() * 30) + 10,
                    temperatura: Math.floor(Math.random() * 20) + 40,
                    uptime: (Math.random() * 0.5 + 99.5).toFixed(1)
                },
                'shield': {
                    ameacas: Math.floor(Math.random() * 100) + 10,
                    monitoramento: Math.floor(Math.random() * 24) + 1,
                    alertas: Math.floor(Math.random() * 20) + 2,
                    uptime: (Math.random() * 0.5 + 99.5).toFixed(1)
                },
                'dev': {
                    commits: Math.floor(Math.random() * 200) + 20,
                    entregas: Math.floor(Math.random() * 30) + 5,
                    tasks: Math.floor(Math.random() * 50) + 10,
                    uptime: (Math.random() * 0.5 + 99.5).toFixed(1)
                },
                'optimizer': {
                    cpu: Math.floor(Math.random() * 30) + 10,
                    memoria: Math.floor(Math.random() * 40) + 20,
                    disco: Math.floor(Math.random() * 30) + 10,
                    uptime: (Math.random() * 0.5 + 99.5).toFixed(1)
                }
            };

            return data[service] || { uptime: '99.9' };
        }

        // ============================================
        // RENDERIZAR RELATÓRIOS
        // ============================================
        function renderReports(activeServices) {
            reportsContainer.innerHTML = '';

            if (!activeServices || activeServices.length === 0) {
                reportsContainer.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">📊</span>
                        <h3>Nenhum relatório disponível</h3>
                        <p>Assim que você contratar um serviço, relatórios de performance aparecerão aqui.</p>
                        <span class="sub">💡 Contrate um serviço para começar a acompanhar suas métricas.</span>
                    </div>
                `;
                return;
            }

            // Criar grid de relatórios
            const grid = document.createElement('div');
            grid.className = 'reports-grid';

            activeServices.forEach(service => {
                const info = SERVICE_INFO[service.service] || {
                    name: service.service,
                    icon: '📦',
                    description: 'Serviço ativo'
                };

                const data = generateReportData(service.service);

                const card = document.createElement('div');
                card.className = 'report-card';

                // Gerar métricas HTML
                let metricsHTML = '';
                const metricLabels = {
                    'hub': { comandos: 'Comandos', membros: 'Membros', tickets: 'Tickets' },
                    'boost': { fps: 'FPS', latencia: 'Latência (ms)', temperatura: 'Temperatura °C' },
                    'shield': { ameacas: 'Ameaças', monitoramento: 'Monitoramento (h)', alertas: 'Alertas' },
                    'dev': { commits: 'Commits', entregas: 'Entregas', tasks: 'Tasks' },
                    'optimizer': { cpu: 'CPU %', memoria: 'Memória %', disco: 'Disco %' }
                };

                const labels = metricLabels[service.service] || {};

                Object.keys(labels).forEach(key => {
                    if (data[key] !== undefined) {
                        metricsHTML += `
                            <div class="metric">
                                <div class="value">${data[key]}</div>
                                <div class="label">${labels[key]}</div>
                            </div>
                        `;
                    }
                });

                card.innerHTML = `
                    <span class="icon">${info.icon}</span>
                    <h3>${info.name}</h3>
                    <p>${info.description}</p>
                    <div class="report-metrics">${metricsHTML}</div>
                    <span class="status-badge available">✅ Disponíveis</span>
                    <button class="btn-download-report" onclick="downloadReport('${service.service}')">
                        <i class="fas fa-download"></i> Baixar Relatório
                    </button>
                `;

                grid.appendChild(card);
            });

            reportsContainer.appendChild(grid);
        }

        // ============================================
        // BUSCAR SERVIÇOS ATIVOS DO USUÁRIO
        // ============================================
        async function fetchActiveServices(userId) {
            try {
                const { data, error } = await supabaseClient
                    .from('subscriptions')
                    .select('service, status')
                    .eq('user_id', userId)
                    .eq('status', 'active');

                if (error) throw error;
                return data || [];
            } catch (error) {
                console.error('❌ Erro ao buscar serviços:', error);
                return [];
            }
        }

        // ============================================
        // DOWNLOAD DO RELATÓRIO
        // ============================================
        function downloadReport(service) {
            const info = SERVICE_INFO[service] || { name: service };
            const data = generateReportData(service);

            // Criar conteúdo do relatório
            let content = `=== RELATÓRIO ADVANNCE ===\n\n`;
            content += `Serviço: ${info.name}\n`;
            content += `Data: ${new Date().toLocaleDateString()}\n`;
            content += `Hora: ${new Date().toLocaleTimeString()}\n\n`;
            content += `--- Métricas ---\n`;

            const metricLabels = {
                'hub': { comandos: 'Comandos Executados', membros: 'Membros Ativos', tickets: 'Tickets Abertos' },
                'boost': { fps: 'FPS Médio', latencia: 'Latência (ms)', temperatura: 'Temperatura (°C)' },
                'shield': { ameacas: 'Ameaças Bloqueadas', monitoramento: 'Monitoramento (h)', alertas: 'Alertas' },
                'dev': { commits: 'Commits', entregas: 'Entregas', tasks: 'Tasks' },
                'optimizer': { cpu: 'CPU (%)', memoria: 'Memória (%)', disco: 'Disco (%)' }
            };

            const labels = metricLabels[service] || {};
            Object.keys(labels).forEach(key => {
                if (data[key] !== undefined) {
                    content += `${labels[key]}: ${data[key]}\n`;
                }
            });

            content += `\nUptime: ${data.uptime || '99.9'}%\n`;
            content += `\n--- Fim do Relatório ---\n`;

            // Criar e baixar arquivo
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `relatorio-${service}-${new Date().toISOString().slice(0,10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // Feedback
            alertMessage.textContent = `✅ Relatório do ${info.name} baixado com sucesso!`;
            alertInfo.classList.remove('hidden');
            setTimeout(() => alertInfo.classList.add('hidden'), 3000);
        }

        // ============================================
        // VERIFICAR USUÁRIO
        // ============================================
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (session) {
                const user = session.user;
                updateHeader(user);

                const activeServices = await fetchActiveServices(user.id);
                renderReports(activeServices);

            } else {
                window.location.href = '../login/index.html';
            }
        });

        // ============================================
        // LOGOUT
        // ============================================
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = '../login/index.html';
        });

        // Tornar função global para uso no HTML
        window.downloadReport = downloadReport;
    </script>
</body>
</html>
