<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios | AdvancceHub</title>
    
    <!-- FAVICON -->
    <link rel="icon" href="../img/logo.png" type="image/x-icon">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           RESET E VARIÁVEIS (Identidade AdvancceHub)
        ========================================== */
        :root {
            --primary: #c8102e;
            --primary-dark: #9e0b23;
            --primary-light: #e11d48;
            --primary-transparent: rgba(200, 16, 46, 0.1);
            
            --bg: #050505;
            --bg-2: #0f0f11;
            --bg-card: rgba(20, 20, 24, 0.6);
            
            --border: rgba(255, 255, 255, 0.08);
            --border-light: rgba(255, 255, 255, 0.15);
            
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --metal-dark: #6b7280;
            
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            
            --font: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(200, 16, 46, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(200, 16, 46, 0.03) 0%, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard-page {
            min-height: 100vh;
            padding: 100px 20px 60px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ==========================================
           HEADER DO DASHBOARD
        ========================================== */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px 25px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .user-info { display: flex; align-items: center; gap: 15px; }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: var(--primary-transparent);
            border: 1px solid var(--border-neon);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-light);
        }

        .user-name { font-weight: 700; font-size: 1.1rem; color: #fff; }
        .user-email { color: var(--text-muted); font-size: 0.8rem; }

        .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        .btn-header-action {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-header-action:hover {
            border-color: var(--primary-light);
            color: var(--primary-light);
            background: var(--primary-transparent);
        }

        /* ==========================================
           NAVEGAÇÃO
        ========================================== */
        .dashboard-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            padding: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .dashboard-nav a {
            padding: 10px 18px;
            border-radius: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
        }

        .dashboard-nav a:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }

        .dashboard-nav a.active {
            background: var(--primary-transparent);
            color: var(--primary-light);
            border: 1px solid var(--border-neon);
        }

        /* ==========================================
           TÍTULOS
        ========================================== */
        .section-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            color: var(--primary-light);
        }

        .section-subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        /* ==========================================
           GRID DE RELATÓRIOS
        ========================================== */
        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .report-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .report-card:hover {
            border-color: rgba(200, 16, 46, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .report-card .icon {
            font-size: 2.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background: var(--primary-transparent);
            border-radius: 12px;
            margin-bottom: 15px;
            color: var(--primary-light);
        }

        .report-card h3 {
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
            font-size: 1.1rem;
        }

        .report-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.5;
        }

        /* ==========================================
           MÉTRICAS INTERNAS
        ========================================== */
        .report-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .report-metrics .metric {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 8px;
        }

        .report-metrics .metric .value {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary-light);
            line-height: 1.1;
        }

        .report-metrics .metric .label {
            color: var(--metal-dark);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
            font-weight: 500;
        }

        /* ==========================================
           STATUS E BOTÃO DE DOWNLOAD
        ========================================== */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 20px;
        }

        .status-badge.available {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        .status-badge.pending {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        .status-badge.unavailable {
            background: rgba(200, 16, 46, 0.1);
            border: 1px solid rgba(200, 16, 46, 0.2);
            color: #f87171;
        }

        .btn-download-report {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 15px;
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--primary-light);
            color: var(--primary-light);
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s;
            width: 100%;
            cursor: pointer;
        }

        .btn-download-report:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .btn-download-report.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: var(--metal-dark);
            color: var(--metal-dark);
        }

        .btn-download-report.disabled:hover {
            background: transparent;
            color: var(--metal-dark);
        }

        /* ==========================================
           EMPTY STATE
        ========================================== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border: 1px dashed var(--border-light);
            border-radius: 12px;
        }

        .empty-state .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 15px;
            color: var(--metal-dark);
        }

        .empty-state h3 {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-muted);
            max-width: 400px;
            margin: 0 auto 10px;
            font-size: 0.85rem;
        }

        .empty-state .sub {
            color: var(--metal-dark);
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        /* ==========================================
           ALERTAS
        ========================================== */
        .alert {
            padding: 14px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
        }

        .hidden { display: none !important; }

        /* ==========================================
           RESPONSIVO
        ========================================== */
        @media (max-width: 768px) {
            .dashboard-header { flex-direction: column; text-align: center; }
            .user-info { flex-direction: column; }
            .dashboard-nav { flex-direction: column; }
            .dashboard-nav a { justify-content: center; }
            .reports-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="dashboard-page">
        <div class="container">

            <!-- HEADER -->
            <header class="dashboard-header">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div>
                        <div class="user-name" id="userName">Usuário</div>
                        <div class="user-email" id="userEmail">email@email.com</div>
                    </div>
                </div>
                <div class="header-actions">
                    <a href="../index.html" class="btn-header-action">
                        <i class="fas fa-home"></i> Site
                    </a>
                    <button class="btn-header-action" id="logoutBtn">
                        <i class="fas fa-arrow-right-from-bracket"></i> Sair
                    </button>
                </div>
            </header>

            <!-- NAVEGAÇÃO -->
            <nav class="dashboard-nav">
                <a href="index.html"><i class="fas fa-home"></i> Visão Geral</a>
                <a href="perfil.html"><i class="fas fa-user"></i> Meus Dados</a>
                <a href="servicos.html"><i class="fas fa-box"></i> Meus Serviços</a>
                <a href="tickets.html"><i class="fas fa-ticket"></i> Tickets</a>
                <a href="notificacoes.html"><i class="fas fa-bell"></i> Notificações</a>
                <a href="relatorios.html" class="active"><i class="fas fa-chart-bar"></i> Relatórios</a>
                <a href="bot.html"><i class="fas fa-robot"></i> Dashboard Bot</a>
            </nav>

            <!-- TÍTULO -->
            <h2 class="section-title">
                <i class="fa-solid fa-chart-line"></i> Relatórios
            </h2>
            <p class="section-subtitle">Acompanhe o desempenho dos seus serviços contratados.</p>

            <!-- ALERTA -->
            <div id="alertInfo" class="alert alert-info hidden">
                <i class="fas fa-circle-info"></i>
                <span id="alertMessage">Gerando relatório...</span>
            </div>

            <!-- LISTA DE RELATÓRIOS -->
            <div id="reportsContainer">
                <!-- Será preenchido pelo JavaScript -->
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = "https://bdavgvwaxlokeoaichsw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_C1gh4XFD2148HjtSMzEEFg_2-A8S5IY";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const reportsContainer = document.getElementById('reportsContainer');
        const alertInfo = document.getElementById('alertInfo');
        const alertMessage = document.getElementById('alertMessage');

        // ============================================
        // MAPEAMENTO DE SERVIÇOS
        // ============================================
        const SERVICE_INFO = {
            'hub': {
                name: 'Advancce Hub',
                icon: '<i class="fa-solid fa-robot"></i>',
                description: 'Bot de moderação e tickets',
                metrics: ['comandos', 'membros', 'tickets']
            },
            'boost': {
                name: 'Advancce Boost',
                icon: '<i class="fa-solid fa-gauge-high"></i>',
                description: 'Otimização de performance',
                metrics: ['fps', 'latencia', 'temperatura']
            },
            'shield': {
                name: 'Advancce Shield',
                icon: '<i class="fa-solid fa-shield-halved"></i>',
                description: 'Proteção e segurança',
                metrics: ['ameacas', 'monitoramento', 'alertas']
            },
            'dev': {
                name: 'Advancce Dev',
                icon: '<i class="fa-solid fa-code"></i>',
                description: 'Desenvolvimento sob medida',
                metrics: ['commits', 'entregas', 'tasks']
            },
            'optimizer': {
                name: 'Advancce Optimizer',
                icon: '<i class="fa-solid fa-bolt"></i>',
                description: 'Otimização do sistema',
                metrics: ['cpu', 'memoria', 'disco']
            }
        };

        // ============================================
        // ATUALIZAR HEADER
        // ============================================
        function updateHeader(user) {
            const name = user.user_metadata?.full_name || 'Usuário';
            const email = user.email || 'email@email.com';
            const initial = name.charAt(0).toUpperCase();

            document.getElementById('userName').textContent = name;
            document.getElementById('userEmail').textContent = email;
            document.getElementById('userAvatar').textContent = initial;
        }

        // ============================================
        // GERAR DADOS SIMULADOS DO RELATÓRIO
        // ============================================
        function generateReportData(service) {
            const data = {
                'hub': {
                    comandos: Math.floor(Math.random() * 5000) + 1000,
                    membros: Math.floor(Math.random() * 1000) + 50,
                    tickets: Math.floor(Math.random() * 50) + 5,
                    uptime: (Math.random() * 0.5 + 99.5).toFixed(1)
                },
                'boost': {
                    fps: Math.floor(Math.random() * 120) + 60,
                    latencia: Math.floor(Math.random() * 30) + 10,
                    temperatura: Math.floor(Math.random() * 20) + 40,
                    uptime: (Math.random() * 0.5 + 99.5).toFixed(1)
                },
                'shield': {
                    ameacas: Math.floor(Math.random() * 100) + 10,
                    monitoramento: Math.floor(Math.random() * 24) + 1,
                    alertas: Math.floor(Math.random() * 20) + 2,
                    uptime: (Math.random() * 0.5 + 99.5).toFixed(1)
                },
                'dev': {
                    commits: Math.floor(Math.random() * 200) + 20,
                    entregas: Math.floor(Math.random() * 30) + 5,
                    tasks: Math.floor(Math.random() * 50) + 10,
                    uptime: (Math.random() * 0.5 + 99.5).toFixed(1)
                },
                'optimizer': {
                    cpu: Math.floor(Math.random() * 30) + 10,
                    memoria: Math.floor(Math.random() * 40) + 20,
                    disco: Math.floor(Math.random() * 30) + 10,
                    uptime: (Math.random() * 0.5 + 99.5).toFixed(1)
                }
            };

            return data[service] || { uptime: '99.9' };
        }

        // ============================================
        // RENDERIZAR RELATÓRIOS
        // ============================================
        function renderReports(activeServices) {
            reportsContainer.innerHTML = '';

            if (!activeServices || activeServices.length === 0) {
                reportsContainer.innerHTML = `
                    <div class="empty-state">
                        <span class="icon"><i class="fa-solid fa-chart-pie"></i></span>
                        <h3>Nenhum relatório disponível</h3>
                        <p>Assim que você contratar um serviço, relatórios de performance aparecerão aqui.</p>
                        <span class="sub"><i class="fa-solid fa-lightbulb"></i> Contrate um serviço para começar a acompanhar suas métricas.</span>
                    </div>
                `;
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'reports-grid';

            activeServices.forEach(service => {
                const info = SERVICE_INFO[service.service] || {
                    name: service.service,
                    icon: '<i class="fa-solid fa-box"></i>',
                    description: 'Serviço ativo'
                };

                const data = generateReportData(service.service);

                const card = document.createElement('div');
                card.className = 'report-card';

                let metricsHTML = '';
                const metricLabels = {
                    'hub': { comandos: 'Comandos', membros: 'Membros', tickets: 'Tickets' },
                    'boost': { fps: 'FPS', latencia: 'Latência (ms)', temperatura: 'Temp °C' },
                    'shield': { ameacas: 'Ameaças', monitoramento: 'Monitor (h)', alertas: 'Alertas' },
                    'dev': { commits: 'Commits', entregas: 'Entregas', tasks: 'Tasks' },
                    'optimizer': { cpu: 'CPU %', memoria: 'Memória %', disco: 'Disco %' }
                };

                const labels = metricLabels[service.service] || {};

                Object.keys(labels).forEach(key => {
                    if (data[key] !== undefined) {
                        metricsHTML += `
                            <div class="metric">
                                <div class="value">${data[key]}</div>
                                <div class="label">${labels[key]}</div>
                            </div>
                        `;
                    }
                });

                card.innerHTML = `
                    <div class="icon">${info.icon}</div>
                    <h3>${info.name}</h3>
                    <p>${info.description}</p>
                    <div class="report-metrics">${metricsHTML}</div>
                    <span class="status-badge available"><i class="fa-solid fa-circle-check"></i> Disponível</span>
                    <button class="btn-download-report" onclick="downloadReport('${service.service}')">
                        <i class="fas fa-download"></i> Baixar Relatório
                    </button>
                `;

                grid.appendChild(card);
            });

            reportsContainer.appendChild(grid);
        }

        // ============================================
        // BUSCAR SERVIÇOS ATIVOS DO USUÁRIO
        // ============================================
        async function fetchActiveServices(userId) {
            try {
                const { data, error } = await supabaseClient
                    .from('subscriptions')
                    .select('service, status')
                    .eq('user_id', userId)
                    .eq('status', 'active');

                if (error) throw error;
                return data || [];
            } catch (error) {
                console.error('❌ Erro ao buscar serviços:', error);
                return [];
            }
        }

        // ============================================
        // DOWNLOAD DO RELATÓRIO
        // ============================================
        function downloadReport(service) {
            const info = SERVICE_INFO[service] || { name: service };
            const data = generateReportData(service);

            let content = `=== RELATÓRIO ADVANCCE HUB ===\n\n`;
            content += `Serviço: ${info.name}\n`;
            content += `Data: ${new Date().toLocaleDateString()}\n`;
            content += `Hora: ${new Date().toLocaleTimeString()}\n\n`;
            content += `--- Métricas ---\n`;

            const metricLabels = {
                'hub': { comandos: 'Comandos Executados', membros: 'Membros Ativos', tickets: 'Tickets Abertos' },
                'boost': { fps: 'FPS Médio', latencia: 'Latência (ms)', temperatura: 'Temperatura (°C)' },
                'shield': { ameacas: 'Ameaças Bloqueadas', monitoramento: 'Monitoramento (h)', alertas: 'Alertas' },
                'dev': { commits: 'Commits', entregas: 'Entregas', tasks: 'Tasks' },
                'optimizer': { cpu: 'CPU (%)', memoria: 'Memória (%)', disco: 'Disco (%)' }
            };

            const labels = metricLabels[service] || {};
            Object.keys(labels).forEach(key => {
                if (data[key] !== undefined) {
                    content += `${labels[key]}: ${data[key]}\n`;
                }
            });

            content += `\nUptime: ${data.uptime || '99.9'}%\n`;
            content += `\n--- Fim do Relatório ---\n`;

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `relatorio-${service}-${new Date().toISOString().slice(0,10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            alertMessage.innerHTML = `<i class="fa-solid fa-circle-check"></i> Relatório do ${info.name} baixado com sucesso!`;
            alertInfo.classList.remove('hidden');
            setTimeout(() => alertInfo.classList.add('hidden'), 3000);
        }

        // ============================================
        // VERIFICAR USUÁRIO
        // ============================================
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (session) {
                const user = session.user;
                updateHeader(user);

                const activeServices = await fetchActiveServices(user.id);
                renderReports(activeServices);

            } else {
                window.location.href = '../login/index.html';
            }
        });

        // ============================================
        // LOGOUT
        // ============================================
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = '../login/index.html';
        });

        window.downloadReport = downloadReport;
    </script>
</body>
</html>
