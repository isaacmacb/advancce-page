<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Dados | AdvancceHub</title>
    
    <!-- FAVICON -->
    <link rel="icon" href="../img/logo.png" type="image/x-icon">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           RESET E VARIÁVEIS (Identidade AdvancceHub)
        ========================================== */
        :root {
            --primary: #c8102e;
            --primary-dark: #9e0b23;
            --primary-light: #e11d48;
            --primary-transparent: rgba(200, 16, 46, 0.1);
            
            --bg: #050505;
            --bg-2: #0f0f11;
            --bg-card: rgba(20, 20, 24, 0.6);
            
            --border: rgba(255, 255, 255, 0.08);
            --border-light: rgba(255, 255, 255, 0.15);
            
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --metal-dark: #6b7280;
            
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;
            
            --font: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(200, 16, 46, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(200, 16, 46, 0.03) 0%, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard-page {
            min-height: 100vh;
            padding: 100px 20px 60px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* ==========================================
           HEADER DO DASHBOARD
        ========================================== */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px 25px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: var(--primary-transparent);
            border: 1px solid var(--border-neon);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-light);
        }

        .user-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
        }

        .user-email {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .btn-logout {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-logout:hover {
            border-color: var(--primary-light);
            color: var(--primary-light);
            background: var(--primary-transparent);
        }

        /* ==========================================
           NAVEGAÇÃO
        ========================================== */
        .dashboard-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            padding: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .dashboard-nav a {
            padding: 10px 18px;
            border-radius: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
        }

        .dashboard-nav a:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }

        .dashboard-nav a.active {
            background: var(--primary-transparent);
            color: var(--primary-light);
            border: 1px solid var(--border-neon);
        }

        /* ==========================================
           CARD DE PERFIL
        ========================================== */
        .profile-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 35px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 60%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .profile-card h2 {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-card h2 i {
            color: var(--primary-light);
        }

        .profile-card .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 30px;
        }

        /* ==========================================
           FORMULÁRIO
        ========================================== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 14px;
            color: var(--metal-dark);
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--font);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 0 3px var(--primary-transparent);
        }

        .form-group input:focus + i.input-icon,
        .form-group input:not(:placeholder-shown) + i.input-icon {
            color: var(--primary-light);
        }

        .form-group input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: rgba(0, 0, 0, 0.2);
        }

        /* ==========================================
           BOTÕES
        ========================================== */
        .btn-save {
            padding: 12px 24px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-family: var(--font);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-save:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(200, 16, 46, 0.4);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 25px;
            color: var(--metal-dark);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.3s;
        }

        .btn-back:hover {
            color: var(--primary-light);
        }

        /* ==========================================
           ALERTAS
        ========================================== */
        .alert {
            padding: 14px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .alert-danger {
            background: rgba(200, 16, 46, 0.1);
            border: 1px solid rgba(200, 16, 46, 0.3);
            color: #f87171;
        }

        .hidden { display: none !important; }

        /* ==========================================
           RESPONSIVO
        ========================================== */
        @media (max-width: 768px) {
            .dashboard-header { flex-direction: column; text-align: center; }
            .user-info { flex-direction: column; }
            .dashboard-nav { flex-direction: column; }
            .dashboard-nav a { justify-content: center; }
            .profile-card { padding: 25px 20px; }
        }
    </style>
</head>
<body>
    <div class="dashboard-page">
        <div class="container">

            <!-- HEADER -->
            <header class="dashboard-header">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div>
                        <div class="user-name" id="userName">Usuário</div>
                        <div class="user-email" id="userEmail">email@email.com</div>
                    </div>
                </div>
                <button class="btn-logout" id="logoutBtn">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
                </button>
            </header>

            <!-- NAVEGAÇÃO -->
            <nav class="dashboard-nav">
                <a href="index.html"><i class="fas fa-home"></i> Visão Geral</a>
                <a href="perfil.html" class="active"><i class="fas fa-user"></i> Meus Dados</a>
                <a href="servicos.html"><i class="fas fa-box"></i> Meus Serviços</a>
                <a href="tickets.html"><i class="fas fa-ticket"></i> Tickets</a>
                <a href="notificacoes.html"><i class="fas fa-bell"></i> Notificações</a>
                <a href="relatorios.html"><i class="fas fa-chart-bar"></i> Relatórios</a>
                <a href="bot.html"><i class="fas fa-robot"></i> Dashboard Bot</a>
            </nav>

            <!-- PERFIL -->
            <div class="profile-card">
                <h2><i class="fa-solid fa-user-gear"></i> Meus Dados</h2>
                <p class="subtitle">Visualize e atualize suas informações pessoais.</p>

                <div id="alertSuccess" class="alert alert-success hidden">
                    <i class="fa-solid fa-circle-check"></i> Dados atualizados com sucesso!
                </div>
                <div id="alertError" class="alert alert-danger hidden">
                    <i class="fa-solid fa-circle-exclamation"></i> Erro ao atualizar dados.
                </div>

                <form id="profileForm">
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-user input-icon"></i>
                            <input type="text" id="profileName" placeholder="Seu nome completo">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope input-icon"></i>
                            <input type="email" id="profileEmail" disabled>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Nova Senha (Opcional)</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="profilePassword" placeholder="Digite a nova senha">
                        </div>
                    </div>

                    <button type="submit" class="btn-save">
                        <i class="fa-solid fa-floppy-disk"></i> Salvar Alterações
                    </button>
                </form>

                <a href="index.html" class="btn-back">
                    <i class="fa-solid fa-arrow-left"></i> Voltar para o Dashboard
                </a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = "https://bdavgvwaxlokeoaichsw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_C1gh4XFD2148HjtSMzEEFg_2-A8S5IY";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        const profileName = document.getElementById('profileName');
        const profileEmail = document.getElementById('profileEmail');
        const profileForm = document.getElementById('profileForm');
        const alertSuccess = document.getElementById('alertSuccess');
        const alertError = document.getElementById('alertError');

        // Atualizar header com dados do usuário
        function updateUserUI(user) {
            const name = user.user_metadata?.full_name || 'Usuário';
            const email = user.email || 'email@email.com';
            const initial = name.charAt(0).toUpperCase();

            document.getElementById('userName').textContent = name;
            document.getElementById('userEmail').textContent = email;
            document.getElementById('userAvatar').textContent = initial;
        }

        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) {
                currentUser = session.user;
                profileName.value = currentUser.user_metadata?.full_name || '';
                profileEmail.value = currentUser.email || '';
                updateUserUI(currentUser);
            } else {
                window.location.href = '../login/index.html';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = '../login/index.html';
        });

        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = profileName.value.trim();
            const password = document.getElementById('profilePassword').value;

            if (!name) {
                alertError.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> O nome é obrigatório.';
                alertError.classList.remove('hidden');
                alertSuccess.classList.add('hidden');
                return;
            }

            // Efeito de loading no botão
            const submitBtn = profileForm.querySelector('.btn-save');
            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Salvando...';
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';

            try {
                // Atualizar nome
                const { error: updateError } = await supabaseClient.auth.updateUser({
                    data: { full_name: name }
                });

                if (updateError) throw updateError;

                // Atualizar senha se preenchida
                if (password && password.length >= 6) {
                    const { error: passError } = await supabaseClient.auth.updateUser({
                        password: password
                    });
                    if (passError) throw passError;
                }

                alertSuccess.innerHTML = '<i class="fa-solid fa-circle-check"></i> Dados atualizados com sucesso!';
                alertSuccess.classList.remove('hidden');
                alertError.classList.add('hidden');

                // Limpar campo de senha
                document.getElementById('profilePassword').value = '';

                // Atualizar UI
                const currentSession = await supabaseClient.auth.getSession();
                if (currentSession.data.session) {
                    updateUserUI(currentSession.data.session.user);
                }

                setTimeout(() => alertSuccess.classList.add('hidden'), 3000);

            } catch (error) {
                alertError.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${error.message}`;
                alertError.classList.remove('hidden');
                alertSuccess.classList.add('hidden');
            } finally {
                // Restaura o botão
                submitBtn.innerHTML = originalBtnHtml;
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
