<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | AdvancceHub</title>
    
    <!-- FAVICON -->
    <link rel="icon" href="../img/logo.png" type="image/x-icon">

    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        /* ==========================================
           RESET & VARIÁVEIS (Baseado na Landing Page)
           ========================================== */
        :root {
            --primary: #c8102e;
            --primary-dark: #9e0b23;
            --primary-light: #e11d48;
            --primary-transparent: rgba(200, 16, 46, 0.1);
            --bg: #050505;
            --bg-card: rgba(20, 20, 24, 0.8);
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(200, 16, 46, 0.5);
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --metal: #d1d5db;
            --metal-dark: #6b7280;
            --font: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(200, 16, 46, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(200, 16, 46, 0.05) 0%, transparent 50%);
            font-family: var(--font);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        /* ==========================================
           CARD DE CADASTRO
           ========================================== */
        .auth-box {
            max-width: 420px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: fadeUp 0.5s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo e Título */
        .auth-box .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-box .logo img {
            height: 40px;
            width: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(200, 16, 46, 0.3));
        }

        .auth-box .logo h2 {
            font-weight: 800;
            color: #fff;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .auth-box .logo h2 span {
            color: var(--primary-light);
        }

        .auth-box .logo p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 5px;
        }

        /* ==========================================
           FORMULÁRIO E INPUTS
           ========================================== */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.8rem;
            color: var(--metal);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 14px;
            color: var(--metal-dark);
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px 12px 40px; /* Espaço para o ícone */
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--font);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 0 3px var(--primary-transparent);
        }

        .form-group input:focus + i.input-icon,
        .form-group input:not(:placeholder-shown) + i.input-icon {
            color: var(--primary-light);
        }

        .form-group input::placeholder {
            color: var(--metal-dark);
        }

        /* Botão de mostrar senha */
        .toggle-password {
            position: absolute;
            right: 14px;
            color: var(--metal-dark);
            cursor: pointer;
            background: none;
            border: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: var(--metal);
        }

        /* ==========================================
           REQUISITOS DE SENHA
           ========================================== */
        .password-requirements {
            margin-top: 8px;
            font-size: 0.75rem;
        }

        .password-requirements ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 15px;
        }

        .password-requirements ul li {
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .password-requirements ul li.valid {
            color: #10b981; /* Verde Esmeralda */
        }

        .password-requirements ul li.invalid {
            color: var(--text-muted);
        }

        /* ==========================================
           BOTÃO PRINCIPAL
           ========================================== */
        .auth-btn {
            width: 100%;
            padding: 14px;
            border-radius: 6px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-family: var(--font);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .auth-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(200, 16, 46, 0.4);
        }

        .auth-btn:active {
            transform: translateY(0);
        }

        /* ==========================================
           DIVISOR E FOOTER
           ========================================== */
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
            color: var(--metal-dark);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .auth-footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .auth-footer a {
            color: var(--primary-light);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s;
        }

        .auth-footer a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 15px;
            color: var(--metal-dark);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.3s;
        }

        .back-home:hover {
            color: var(--metal);
        }

        /* ==========================================
           ALERTAS (ERRO / SUCESSO)
           ========================================== */
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .alert-danger {
            background: rgba(200, 16, 46, 0.1);
            border: 1px solid rgba(200, 16, 46, 0.3);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        .hidden {
            display: none !important;
        }

        /* Responsividade */
        @media (max-width: 480px) {
            .auth-box {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-box">
        <!-- LOGO E TÍTULO -->
        <div class="logo">
            <img src="../img/logo.png" alt="AdvancceHub">
            <h2>Advancce<span>Hub</span></h2>
            <p>Crie sua conta gratuitamente</p>
        </div>

        <!-- ALERTAS -->
        <div id="alertError" class="alert alert-danger hidden">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="alertErrorText"></span>
        </div>
        <div id="alertSuccess" class="alert alert-success hidden">
            <i class="fa-solid fa-circle-check"></i>
            <span id="alertSuccessText"></span>
        </div>

        <!-- FORMULÁRIO -->
        <form id="registerForm">
            <div class="form-group">
                <label>Nome</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input type="text" id="registerName" placeholder="Seu nome completo" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="registerEmail" placeholder="seu@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>Senha</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="registerPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
                    <button type="button" class="toggle-password" id="togglePass1" aria-label="Mostrar senha">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
                <div class="password-requirements">
                    <ul>
                        <li id="reqLength" class="invalid"><i class="fa-solid fa-circle-xmark"></i> Mín. 6 caracteres</li>
                        <li id="reqNumber" class="invalid"><i class="fa-solid fa-circle-xmark"></i> Pelo menos 1 número</li>
                    </ul>
                </div>
            </div>

            <div class="form-group">
                <label>Confirmar Senha</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="registerConfirmPassword" placeholder="Confirme sua senha" required>
                    <button type="button" class="toggle-password" id="togglePass2" aria-label="Mostrar senha">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="auth-btn" id="submitBtn">
                <span>Criar Conta</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-divider">ou</div>

        <div class="auth-footer">
            Já tem uma conta? <a href="../login/index.html">Faça login</a>
            <br>
            <a href="../index.html" class="back-home">
                <i class="fa-solid fa-arrow-left"></i> Voltar para o site
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = "https://bdavgvwaxlokeoaichsw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_C1gh4XFD2148HjtSMzEEFg_2-A8S5IY";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Elementos do DOM
        const registerForm = document.getElementById('registerForm');
        const registerName = document.getElementById('registerName');
        const registerEmail = document.getElementById('registerEmail');
        const registerPassword = document.getElementById('registerPassword');
        const registerConfirmPassword = document.getElementById('registerConfirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        
        const alertError = document.getElementById('alertError');
        const alertErrorText = document.getElementById('alertErrorText');
        const alertSuccess = document.getElementById('alertSuccess');
        const alertSuccessText = document.getElementById('alertSuccessText');

        const reqLength = document.getElementById('reqLength');
        const reqNumber = document.getElementById('reqNumber');

        // Mostrar/Ocultar Senha
        const togglePass1 = document.getElementById('togglePass1');
        const togglePass2 = document.getElementById('togglePass2');

        togglePass1.addEventListener('click', () => {
            const type = registerPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            registerPassword.setAttribute('type', type);
            togglePass1.innerHTML = type === 'password' ? '<i class="fa-regular fa-eye"></i>' : '<i class="fa-regular fa-eye-slash"></i>';
        });

        togglePass2.addEventListener('click', () => {
            const type = registerConfirmPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            registerConfirmPassword.setAttribute('type', type);
            togglePass2.innerHTML = type === 'password' ? '<i class="fa-regular fa-eye"></i>' : '<i class="fa-regular fa-eye-slash"></i>';
        });

        // Validação de Requisitos de Senha
        function updatePasswordRequirement(element, isValid, text) {
            element.classList.remove('valid', 'invalid');
            element.classList.add(isValid ? 'valid' : 'invalid');
            element.innerHTML = isValid 
                ? `<i class="fa-solid fa-circle-check"></i> ${text}` 
                : `<i class="fa-solid fa-circle-xmark"></i> ${text}`;
        }

        registerPassword.addEventListener('input', function() {
            const password = this.value;
            updatePasswordRequirement(reqLength, password.length >= 6, 'Mín. 6 caracteres');
            updatePasswordRequirement(reqNumber, /\d/.test(password), 'Pelo menos 1 número');
        });

        // Funções de Alerta
        function showError(msg) {
            alertErrorText.textContent = msg;
            alertError.classList.remove('hidden');
            alertSuccess.classList.add('hidden');
            setTimeout(() => alertError.classList.add('hidden'), 5000);
        }

        function showSuccess(msg) {
            alertSuccessText.textContent = msg;
            alertSuccess.classList.remove('hidden');
            alertError.classList.add('hidden');
            setTimeout(() => alertSuccess.classList.add('hidden'), 5000);
        }

        // Submit do Formulário
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = registerName.value.trim();
            const email = registerEmail.value.trim();
            const password = registerPassword.value;
            const confirm = registerConfirmPassword.value;

            if (password !== confirm) {
                showError('As senhas não coincidem.');
                return;
            }
            if (password.length < 6) {
                showError('A senha deve ter no mínimo 6 caracteres.');
                return;
            }
            if (!/\d/.test(password)) {
                showError('A senha deve conter pelo menos 1 número.');
                return;
            }

            // Efeito de loading no botão
            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Criando conta...';
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: { data: { full_name: name } }
                });

                if (error) throw error;

                showSuccess('Conta criada com sucesso! Redirecionando...');
                
                setTimeout(() => {
                    window.location.href = '../dashboard/index.html';
                }, 1500);

            } catch (error) {
                showError(error.message);
                
                // Restaura o botão em caso de erro
                submitBtn.innerHTML = originalBtnHtml;
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
