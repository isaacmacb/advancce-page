<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | ADVANNCE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100vh; background: #0a0a0f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: #0a0a0f; }
        .auth-box { max-width: 420px; width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 24px; padding: 40px; box-shadow: 0 25px 60px rgba(0,0,0,0.4); }
        .auth-box .logo { text-align: center; margin-bottom: 30px; }
        .auth-box .logo img { height: 50px; width: auto; }
        .auth-box .logo h2 { margin-top: 10px; font-weight: 700; color: #ffffff; font-size: 1.8rem; }
        .auth-box .logo p { color: #9aa4b8; font-size: 0.9rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; color: #e8edf5; }
        .form-group input { width: 100%; padding: 12px 16px; border-radius: 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); color: #e8edf5; font-size: 0.95rem; outline: none; transition: border-color 0.3s; }
        .form-group input:focus { border-color: #ff3b3b; }
        .form-group input::placeholder { color: #6a7a8a; }
        .auth-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #ff3b3b, #e03030); color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.3s; }
        .auth-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(255,59,59,0.3); }
        .auth-divider { display: flex; align-items: center; gap: 15px; margin: 25px 0; color: #9aa4b8; font-size: 0.85rem; }
        .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06); }
        .auth-footer { text-align: center; margin-top: 25px; color: #9aa4b8; font-size: 0.9rem; }
        .auth-footer a { color: #ff3b3b; font-weight: 600; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
        .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 0.9rem; }
        .alert-danger { background: rgba(255,59,59,0.1); border: 1px solid rgba(255,59,59,0.2); color: #ff6b6b; }
        .alert-success { background: rgba(46,213,115,0.1); border: 1px solid rgba(46,213,115,0.2); color: #2ed573; }
        .hidden { display: none; }
        .password-requirements { font-size: 0.8rem; margin-top: 5px; }
        .password-requirements ul { list-style: none; padding: 0; margin: 5px 0 0; }
        .password-requirements ul li { padding: 3px 0; font-size: 0.85rem; transition: all 0.3s ease; }
        .password-requirements ul li.valid { color: #2ed573 !important; }
        .password-requirements ul li.valid::before { content: '✅ '; }
        .password-requirements ul li.invalid { color: #ff6b6b !important; }
        .password-requirements ul li.invalid::before { content: '🔴 '; }
        .back-home { display: inline-block; margin-top: 15px; color: #9aa4b8; text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
        .back-home:hover { color: #ff3b3b; }
        @media (max-width: 480px) { .auth-box { padding: 25px; } }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-box">
            <div class="logo">
                <img src="../img/logo.png" alt="ADVANNCE">
                <h2>ADVANNCE</h2>
                <p>Crie sua conta gratuitamente</p>
            </div>

            <div id="alertError" class="alert alert-danger hidden"></div>
            <div id="alertSuccess" class="alert alert-success hidden"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="registerName" placeholder="Seu nome completo" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="registerPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
                    <div class="password-requirements">
                        <ul>
                            <li id="reqLength" class="invalid">Mínimo 6 caracteres</li>
                            <li id="reqNumber" class="invalid">Pelo menos 1 número</li>
                        </ul>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirmar Senha</label>
                    <input type="password" id="registerConfirmPassword" placeholder="Confirme sua senha" required>
                </div>
                <button type="submit" class="auth-btn">Criar Conta</button>
            </form>

            <div class="auth-divider">ou</div>

            <div class="auth-footer">
                Já tem uma conta? <a href="../login/index.html">Faça login</a>
                <br>
                <a href="../index.html" class="back-home">← Voltar para o site</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = "https://bdavgvwaxlokeoaichsw.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_C1gh4XFD2148HjtSMzEEFg_2-A8S5IY";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const registerForm = document.getElementById('registerForm');
        const registerName = document.getElementById('registerName');
        const registerEmail = document.getElementById('registerEmail');
        const registerPassword = document.getElementById('registerPassword');
        const registerConfirmPassword = document.getElementById('registerConfirmPassword');
        const alertError = document.getElementById('alertError');
        const alertSuccess = document.getElementById('alertSuccess');

        const reqLength = document.getElementById('reqLength');
        const reqNumber = document.getElementById('reqNumber');

        function updatePasswordRequirement(element, isValid, text) {
            element.classList.remove('valid', 'invalid');
            element.classList.add(isValid ? 'valid' : 'invalid');
            element.innerHTML = isValid ? '✅ ' + text : '🔴 ' + text;
        }

        registerPassword.addEventListener('input', function() {
            const password = this.value;
            updatePasswordRequirement(reqLength, password.length >= 6, 'Mínimo 6 caracteres');
            updatePasswordRequirement(reqNumber, /\d/.test(password), 'Pelo menos 1 número');
        });

        function showError(msg) {
            alertError.textContent = "❌ " + msg;
            alertError.classList.remove('hidden');
            alertSuccess.classList.add('hidden');
            setTimeout(() => alertError.classList.add('hidden'), 5000);
        }

        function showSuccess(msg) {
            alertSuccess.textContent = "✅ " + msg;
            alertSuccess.classList.remove('hidden');
            alertError.classList.add('hidden');
            setTimeout(() => alertSuccess.classList.add('hidden'), 5000);
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = registerName.value;
            const email = registerEmail.value;
            const password = registerPassword.value;
            const confirm = registerConfirmPassword.value;

            if (password !== confirm) {
                showError('As senhas não coincidem');
                return;
            }
            if (password.length < 6) {
                showError('A senha deve ter no mínimo 6 caracteres');
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: { data: { full_name: name } }
                });

                if (error) throw error;

                showSuccess('Conta criada com sucesso! Redirecionando...');
                setTimeout(() => {
                    window.location.href = '../dashboard/index.html';
                }, 1500);

            } catch (error) {
                showError(error.message);
            }
        });
    </script>
</body>
</html>
